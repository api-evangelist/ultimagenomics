name: Ultimagenomics
description: 'Ultima Genomics develops high-throughput, low-cost DNA sequencing platforms built on a novel
  semiconductor-inspired architecture, aimed at driving the cost of a genome dramatically down to unlock
  population-scale genomics. Its systems support germline and somatic (oncology/MRD) sequencing, single-cell
  and spatial workflows, methylation/epigenomics, and proteomics, and integrate with an open ecosystem
  of third-party library-prep providers (10x Genomics, Olink). Rather than a public REST API, Ultima exposes
  its developer surface as open-source bioinformatics tooling and analysis pipelines: a large GitHub organization
  (Ultimagen) of UG-adapted variant callers and genomics utilities (GATK, Picard, STAR forks, ugbio-utils)
  and AWS HealthOmics WDL workflows for running cost-effective secondary analysis in the cloud.'
